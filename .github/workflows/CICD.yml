# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "nonprod" branch
  workflow_dispatch:
  # push:
  #   branches: [ "dev" ]
permissions:
  id-token: write
  contents: read

  # pull_request:
  #   branches: [ "nonprod" ]

  # Allows you to run this workflow manually from the Actions tab

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    environment:  DEV
    env:
      DATABRICKS_HOST: https://adb-7405614436466627.7.azuredatabricks.net/
      DATABRICKS_AUTH_TYPE: azure-cli
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id:        ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:        ${{ vars.AZURE_TENANT_ID }}
          subscription-id:  ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      
      - name: Who is logged in?
        run: databricks current-user me

      - name: Deploy notebooks via Databricks bundle
        run: |
          databricks bundle validate --target dev
          databricks bundle deploy



