name: CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target to deploy (dev or prod)"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # map GitHub env name if you want (optional)
    environment: ${{ github.event.inputs.target == 'prod' && 'PROD' || 'DEV' }}

    env:
      DATABRICKS_HOST: https://adb-7405614436466627.7.azuredatabricks.net/
      DATABRICKS_AUTH_TYPE: azure-cli
      TARGET: ${{ github.event.inputs.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id:        ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:        ${{ vars.AZURE_TENANT_ID }}
          subscription-id:  ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Who is logged in?
        run: databricks current-user me

      - name: Validate bundle
        working-directory: my_dab
        run: databricks bundle validate --target $TARGET

      - name: Deploy bundle
        working-directory: my_dab
        run: databricks bundle deploy --target $TARGET
