# The main pipeline for my_dab

resources:
  pipelines:
    my_dab_etl:
      name: my_dab_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      root_path: "../src/my_dab_etl"

      libraries:
        - glob:
            include: ../src/my_dab_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
