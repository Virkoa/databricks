resources:
  clusters:
    andrejs_cluster:
      cluster_name: "Andrejs_Cluster"

      num_workers: 0
      node_type_id: "Standard_DS3_v2"          # adjust if needed
      spark_version: "13.3.x-scala2.12"        # adjust if needed

      spark_conf:
        spark.databricks.cluster.profile: "singleNode"
        spark.master: "local[*]"

      autotermination_minutes: 120

      custom_tags:
        ResourceClass: "SingleNode"
        dev: "dtb_cluster"

      # UC access mode – adjust if your workspace uses a different one,
      # but SINGLE_USER is the usual for SP-based clusters
      data_security_mode: "SINGLE_USER"

