resources:
  clusters:
    andrejs_cluster:
      cluster_name: "Andrejs_Cluster"

      # Single node
      num_workers: 0

      # Adjust to valid values in *this* workspace
      node_type_id: "Standard_DS3_v2"
      spark_version: "13.3.x-scala2.12"

      spark_conf:
        spark.databricks.cluster.profile: "singleNode"
        spark.master: "local[*]"

      autotermination_minutes: 120

      custom_tags:
        ResourceClass: "SingleNode"
        dev: "dtb_cluster"

      # Force allowed UC access mode
      data_security_mode: "SINGLE_USER"

      # CRITICAL: Must match the Databricks identity that will own this cluster
      # If you're deploying as a human user:
      #   your_user@company.com (exactly as shown in the workspace UI)
      # If deploying as a service principal:
      #   service-principal object id or whatever Databricks shows for that SP
