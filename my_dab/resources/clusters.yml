resources:
  clusters:
    andrejs_cluster:
      cluster_name: "Andrejs_Cluster"

      # Single-node
      num_workers: 0

      # Node type – adjust to a valid small node in your workspace
      node_type_id: "Standard_DS3_v2"

      # Runtime – adjust to a valid one in your workspace
      spark_version: "13.3.x-scala2.12"

      # Single-node-specific config
      spark_conf:
        spark.databricks.cluster.profile: "singleNode"
        spark.master: "local[*]"

      # Auto-termination after 120 minutes
      autotermination_minutes: 120

      # Tags (required for single-node + your custom tag)
      custom_tags:
        ResourceClass: "SingleNode"
        dev: "dtb_cluster"

      # Optional but common in UC setups; adjust as needed:
      # data_security_mode: "LEGACY_SINGLE_USER"
