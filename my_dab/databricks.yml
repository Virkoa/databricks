# This is a Databricks asset bundle definition for my_dab.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_dab
  uuid: be00e71e-36a6-4884-a038-d23ce0bba778

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405614436466627.7.azuredatabricks.net
    variables:
      catalog: dev_databricks
      schema: ${workspace.current_user.short_name}
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://adb-7405612125064090.10.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/ygorbe@gmail.com to make sure we only have a single copy.
    variables:
      catalog: prod_databricks
      schema: prod
    permissions:
      - user_name: ygorbe@gmail.com
        level: CAN_MANAGE
